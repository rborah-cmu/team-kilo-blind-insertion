# Shared parameters. Units: metres, seconds, newton-metres.
# Values marked TBD are placeholders until the team decides them.

peg:                           # from cad/peg (see cad/peg/README.md)
  top_size: [0.025, 0.025, 0.01905]  # square top, gripped
  shaft_radius: 0.0125         # 25 mm diameter cylinder
  shaft_length: 0.0381         # including the chamfer
  chamfer: 0.001               # 1 mm x 45 deg at the tip
  mass: 0.025                  # TBD: weigh the printed peg (URDF mass is wrong)
  tip_offset_from_flange: 0.15 # calibrate once after grasp (Phase 1 step 1)
  holder_pose: [0.45, -0.25, 0.10, 0.0]  # x, y, z, yaw in robot base frame; TBD

box:                           # from cad/peg_and_base (see its README)
  size: [0.1267, 0.169, 0.0508]  # outer dimensions x, y, z
  search_region:               # where the box may be placed
    x: [0.35, 0.65]
    y: [-0.15, 0.15]

hole:                          # from cad/peg_and_base
  radius: 0.0127               # 25.4 mm through-hole
  clearance: 0.0004            # diametral: 25.4 mm hole - 25.0 mm shaft (before print error)
  chamfer: 0.001               # 1 mm x 45 deg at the top edge
  cad_offset: [0.00262, 0.00302]  # hole centre from box top-face centre in this CAD
  max_offset_from_center: 0.02 # R: hole lies within this radius of the box top centre; TBD

contact:
  tau_ext_threshold: 1.5       # per-joint |tau_ext| that counts as contact; calibrate day 1
  debounce_samples: 5          # threshold must hold this many consecutive samples
  probe_speed: 0.015           # m/s

hole_search:
  num_particles: 4000
  drop_depth: 0.002            # tip this far below the top surface counts as "in the hole"
  stop_std: 0.001              # stop refining when estimate std falls below this

insertion:
  policy_rate_hz: 25
  history_seconds: 0.4
  train_noise_xy: 0.005        # +/- 5 mm until Phase 1 error is measured

sim:
  timestep: 0.001
  menagerie_path: ${MENAGERIE_PATH}
