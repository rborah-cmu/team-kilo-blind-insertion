# Shared parameters. Units: metres, seconds, newton-metres.
# Values marked TBD are placeholders until the team decides them.

peg:                           # from cad/peg (see cad/peg/README.md)
  top_size: [0.025, 0.025, 0.01905]  # square top, gripped
  shaft_radius: 0.0125         # 25 mm diameter cylinder
  shaft_length: 0.0381         # including the chamfer
  chamfer: 0.001               # 1 mm x 45 deg at the tip
  mass: 0.025                  # TBD: weigh the printed peg (URDF mass is wrong)
  tip_offset_from_flange: 0.15 # calibrate once after grasp (Phase 1 step 1)
  holder_pose: [0.45, -0.25, 0.10, 0.0]  # x, y, z, yaw in robot base frame; TBD

box:                           # from cad/peg_and_base (see its README)
  size: [0.1267, 0.169, 0.0508]  # outer dimensions x, y, z
  search_region:               # where the box may be placed
    x: [0.35, 0.65]
    y: [-0.15, 0.15]

hole:                          # from cad/peg_and_base
  radius: 0.0127               # 25.4 mm through-hole
  clearance: 0.0004            # diametral: 25.4 mm hole - 25.0 mm shaft (before print error)
  chamfer: 0.001               # 1 mm x 45 deg at the top edge
  cad_offset: [0.00262, 0.00302]  # hole centre from box top-face centre in this CAD
  max_offset_from_center: 0.02 # R: hole lies within this radius of the box top centre; TBD

contact:
  tau_ext_threshold: 1.5       # per-joint |tau_ext| that counts as contact; calibrate day 1
  debounce_samples: 5          # threshold must hold this many consecutive samples

snake_search:                  # initial plate sweep; see kilo/localization/common.py
  corners:                     # rectangle in the robot base frame, metres
    - [0.32, -0.20]
    - [0.70, -0.20]
    - [0.70, 0.20]
    - [0.32, 0.20]
  tabletop_height: 0.0001        # z of the tabletop
  ee_float_height: 0.03        # height above the tabletop while searching
  virtual_probe_length: 0.047625  # shaft length + half the square top
  force_threshold: 2.0         # N, Cartesian; distinct from contact.tau_ext_threshold

hole_search:
  num_particles: 4000
  drop_depth: 0.002            # tip this far below the top surface counts as "in the hole"
  stop_std: 0.001              # stop refining when estimate std falls below this

insertion:
  policy_rate_hz: 50
  history_seconds: 0.6
  history_frames: 30
  train_noise_xy: 0.005          # fixed +/-5 mm per axis for training AND evaluation
  start_clearance: 0.003        # clears the bounded grasp error; avoids initial penetration
  success_depth: 0.0371
  success_xy_tolerance: 0.0001
  success_hold_seconds: 0.10
  descent_rate: 0.006
  spiral_pitch: 0.001
  spiral_max_radius: 0.009      # exceeds sqrt(2)*5 mm error support
  search_speed: 0.010
  tracking_tolerance: 0.002
  capture_depth: 0.0003
  engagement_depth: 0.003
  capture_timeout: 1.0
  touch_force: 0.15            # N, inferred from joint torques; calibrate on the robot
  touch_samples: 3
  seating_overtravel: 0.003    # nominal TCP allowance for grasp-length error
  search_z_lead: 0.001          # caps search spring load near 0.4 N (Kz=400 N/m)
  insert_z_lead: 0.006
  search_xy_stiffness: 600.0
  insert_xy_stiffness: 150.0
  z_stiffness: 400.0
  rotation_stiffness: [2.0, 2.0, 10.0]  # compliant roll/pitch lets the chamfers align the shaft
  cartesian_damping: [30.0, 30.0, 40.0, 2.0, 2.0, 5.0]
  action_limit_xyz: [0.001, 0.001, 0.0005]
  residual_speed: 0.005         # slew limit; metres per second
  max_episode_steps: 3000       # 60 seconds for search plus seating
  grasp_offset_std: 0.0005
  grasp_tilt_std_rad: 0.0087
  grasp_clip_sigma: 3.0
  ik_tolerance: 0.002
  time_cost_per_second: 0.10
  force_cost_per_second: 0.02
  force_soft_limit: 8.0
  smoothness_cost_per_second: 0.01
  success_reward: 20.0
  ppo_gamma: 0.999
  ppo_gae_lambda: 0.97
  num_envs: 8
  total_timesteps: 2000000
  ppo_n_steps: 512
  ppo_batch_size: 256
  eval_interval: 200000
  eval_episodes: 20

sim:
  timestep: 0.001             # set in kilo/sim/scene.py; mjfit-style stiff contacts need <= 1 ms
  contact_time_constant: 0.005 # five physics steps; reduce one-step contact impulses
